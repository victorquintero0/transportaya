# Prometheus para desarrollo y pruebas: consulta la API cada 15 s. En producción, el mismo archivo con la dirección real
# y, si la API tiene METRICAS_TOKEN, `authorization: { credentials_file: /etc/prometheus/token-metricas }`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: transportaya-api
    metrics_path: /v1/metricas
    static_configs:
      - targets: ['host.docker.internal:3000']
