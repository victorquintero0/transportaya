# Servicios de apoyo para desarrollo local. Los servicios de mapas (OSRM, Photon, PMTiles)
# se agregan en la Fase 0 cuando se prepare el extracto de la ciudad: ver infra/mapas.
name: transportaya

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: transportaya
      POSTGRES_PASSWORD: transportaya
      POSTGRES_DB: transportaya
    ports:
      - '5432:5432'
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transportaya -d transportaya']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento compatible con S3 para documentos y fotos de conductores.
  minio:
    image: minio/minio:latest
    command: server /datos --console-address ':9001'
    environment:
      MINIO_ROOT_USER: transportaya
      MINIO_ROOT_PASSWORD: transportaya-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-datos:/datos

  # Buzón de correo de prueba: interfaz en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # Métricas y tablero (perfil opcional): `docker compose --profile observabilidad up -d`.
  # Prometheus: http://localhost:9090 · Grafana: http://localhost:3001 (admin / admin). Ver infra/observabilidad.
  prometheus:
    profiles: ['observabilidad']
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observabilidad/alertas.yml:/etc/prometheus/alertas.yml:ro

  grafana:
    profiles: ['observabilidad']
    image: grafana/grafana:latest
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observabilidad/grafana/tableros:/var/lib/grafana/tableros:ro

volumes:
  postgres-datos:
  minio-datos:
