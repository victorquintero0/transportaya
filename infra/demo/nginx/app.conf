# Lo comun a las tres apps: la API y el canal en tiempo real pasan por el mismo dominio (asi no hay CORS).

# La API tiene su propio inicio de sesion (Bearer), asi que aqui no se pide la clave del nginx.
location /v1/ {
    auth_basic off;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 12m;
}

# Las cuentas de demostracion de Operacion (entrar con un clic) si quedan detras de la clave.
location = /v1/op/auth/demo {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location /socket.io/ {
    auth_basic off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion_ws;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
}

# El navegador pide estos sin credenciales; no tienen nada privado.
location = /manifest.webmanifest {
    auth_basic off;
    default_type application/manifest+json;
    try_files $uri =404;
}

# Los iconos y el logo: el sistema los descarga sin credenciales al instalar la app en el telefono.
location /marca/ {
    auth_basic off;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

# Lo que cambia en cada version no se guarda en cache: asi los telefonos toman la actualizacion.
location ~ ^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Los archivos con huella en el nombre si se guardan.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
